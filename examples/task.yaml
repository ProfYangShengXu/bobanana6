# 端到端示例：单源、单交付物（离线模型能自己走完的最小形状）。
# 多源版本会切出 merge 层，需要真实模型来合并，见 tests/test_runner.py。
task_id: example-panel
goal: 把债务人敞口面板整理成一份可复核的 CSV
version: 1

deliverables:
  - name: out.csv
    schema: {obligor: str, pd: float, amount: float}

sources:
  # ★ 相对【任务目录】写，不是相对仓库根：跑题时会 chdir 到 task.yaml 所在目录，
  #   写成 `examples/panel.csv` 换个入口（比如走 harness / 走桥）就找不到了，
  #   表现是"在 sources 门被拒"，看着完全不像路径问题。
  - {ref: panel-2026q1, locator: panel.csv}

constraints:
  hard:
    - id: C-rows
      kind: presence
      target: "*"
      spec: {min_rows: 1}
      rationale: "面板不允许为空——空表会被下游当成「这些债务人不存在」"
    - id: C-prov
      kind: provenance
      target: out.csv
      spec: {min_coverage: 0.95}
      rationale: "每个值都要能指回一份快照，否则无法复核"

blind:
  - "本示例只覆盖 2026Q1，跨期比较没有数据"

limits: {max_rounds: 3}

notes: 示例任务：结构最小，但走的是完整的判定链路。
