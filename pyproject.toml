[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bobanana6"
version = "0.0.0"
description = "Deterministic judgment kernel for sharded multi-worker task execution."
# 3.11+ is the floor because the core is meant to stay dependency-free while
# still being able to read TOML through the stdlib (`tomllib`, added in 3.11).
requires-python = ">=3.11"
# `core/` itself stays stdlib-only -- the architecture guard enforces it. These
# are for the environment-side packages: `ontology/` reads YAML, and the JSON
# Schema in `ontology/schemas/` is validated with jsonschema.
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.scripts]
# ★ The only entry point. `uv run bobanana6 run task.yaml` === `cli.py::main`.
bobanana6 = "bobanana6.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Tests import `bobanana6` straight from src/ so the kernel is verifiable
# without installing anything and without a build step.
# `src` for the package; `.` so the acceptance set (spec §14) is importable as a package.
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "arch_guard: architecture purity guards (deterministic, no model, no network)",
  "acceptance_smoke: end-to-end smoke gate over the core kernel with fakes only",
]
