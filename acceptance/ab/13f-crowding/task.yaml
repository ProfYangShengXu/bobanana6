# 13F 修正案感知的持仓重建（AgentHON T1 / QFBench 2.0）
# ★ A 臂用：bb6 单 agent。产物走 files 通道写；官方判据在【外面】跑（不由本任务提供）。
task_id: 13f-amendment-aware-crowding
goal: 重建目标管理人的有效持仓并产出四类分析（集中度/换手/重叠/拥挤），按 instruction.md 的 8 个产物规格写到 output/
version: 1
# ★ 题面声明：`instruction` 这份来源就是**题面**。它的**全文**会被内联进每个块的 brief，
#   八个块读同一份原文 —— 而不是各自去 `sources.snapshot` 取、各自理解。
statement: instruction

deliverables:
  # ★ 层次切分：产物之间的真实数据流由【契约】声明（instruction.md L31/L33/L35 的散文
  #   不解析）。这张图就是 §0 那条链：
  #   filing_resolution → effective_holdings → {metrics, turnover, overlap, crowding,
  #   cleaning_audit} → summary。同层（大括号里的五份）之间没有边。
  - name: output/filing_resolution.csv
    schema: {text: str}
  - name: output/effective_holdings.csv
    schema: {text: str}
    depends_on: [output/filing_resolution.csv]
  - name: output/manager_metrics.csv
    schema: {text: str}
    depends_on: [output/effective_holdings.csv]
  - name: output/turnover.csv
    schema: {text: str}
    depends_on: [output/effective_holdings.csv]
  - name: output/overlap_latest.csv
    schema: {text: str}
    depends_on: [output/effective_holdings.csv]
  - name: output/crowded_securities_latest.csv
    schema: {text: str}
    depends_on: [output/effective_holdings.csv]
  - name: output/cleaning_audit.csv
    schema: {text: str}
    depends_on: [output/effective_holdings.csv]
  - name: output/summary.json
    schema: {text: str}
    depends_on:
      - output/manager_metrics.csv
      - output/turnover.csv
      - output/overlap_latest.csv
      - output/crowded_securities_latest.csv

sources:
  - {ref: instruction, locator: input/instruction.md}
  - {ref: infotable, locator: input/data/INFOTABLE.tsv}
  - {ref: coverpage, locator: input/data/COVERPAGE.tsv}
  - {ref: submission, locator: input/data/SUBMISSION.tsv}
  - {ref: summarypage, locator: input/data/SUMMARYPAGE.tsv}
  - {ref: target-managers, locator: input/data/target_managers.csv}
  - {ref: target-periods, locator: input/data/target_periods.csv}

# ★ content_checks 由 `acceptance/spec_extractor.py` **机械提取**自官方判分器
#   （不是人手写 —— 手写就是猜）。复现命令：
#     .venv/bin/python acceptance/spec_extractor.py \
#       --checks acceptance/ab/13f-crowding/input/checks --yaml
#   提到的那一条正是丢掉的那一份规格：权重按 (manager, period) 分组求和 == 1，atol=1e-10
# ★ content_checks **全部**由 `acceptance/spec_extractor.py` 机械提取自官方判分器
#   （不是人手写 —— 手写就是猜）。复现命令：
#     .venv/bin/python acceptance/spec_extractor.py \
#       --checks acceptance/ab/13f-crowding/input/checks --yaml
#   两条关键读数：① 每条不变量都带 `applies_to`（它约束**哪份产物**，算出来的）；
#               ② summary 数值键容差 abs_tol=1e-12 + 非数值键严格相等（判分器定的尺子）
content_checks:
  invariants:
    - applies_to: "output/effective_holdings.csv"
      left: "weight"
      op: "eq"
      aggregate: "sum"
      right: 1.0
      group_by:
        - "manager_order"
        - "period_order"
      tol: 1e-10
    - applies_to: "output/summary.json"
      left: "num_managers"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "num_periods"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "num_applied_filings"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "num_clean_positions"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "num_unique_latest_cusips"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "num_append_new_holdings_filings"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "num_restatement_filings"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "num_filtered_nonsh_rows"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "num_filtered_putcall_rows"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "max_summarypage_abs_value_diff"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "max_turnover_value"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "max_overlap_value"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "top_crowded_holder_count"
      right: "abs_tol"
      op: "abs_tol"
      tol: 1e-12
    - applies_to: "output/summary.json"
      left: "weights_sum_check_passed"
      right: "strict"
      op: "strict"
      tol: 0.0
    - applies_to: "output/summary.json"
      left: "summarypage_checks_passed"
      right: "strict"
      op: "strict"
      tol: 0.0
    - applies_to: "output/summary.json"
      left: "all_required_files_written"
      right: "strict"
      op: "strict"
      tol: 0.0
    - applies_to: "output/summary.json"
      left: "all_checks_passed"
      right: "strict"
      op: "strict"
      tol: 0.0
constraints:
  # ★ 只放一条【弱】自检：产物在不在、能不能解析。
  #   真正的判据（官方 test_outputs.py + reference_data）在【外面】跑 —— 不许放进本任务，
  #   否则参考答案会泄漏进 agent 的可见范围（照官方口径：checks 是 grader 侧材料）。
  hard:
    - id: C-outputs-present
      kind: custom
      target: output/summary.json
      spec:
        check: shell_command
        command: "cd _run/workspace && /mnt/c/Users/45140/OneDrive/Desktop/项目/bobanana6/.venv/bin/python -c \"import json,pathlib; d=pathlib.Path('output'); need=['filing_resolution.csv','effective_holdings.csv','manager_metrics.csv','turnover.csv','overlap_latest.csv','crowded_securities_latest.csv','cleaning_audit.csv','summary.json']; miss=[f for f in need if not (d/f).exists() or (d/f).stat().st_size==0]; json.load(open(d/'summary.json')); print('missing:', miss); raise SystemExit(1 if miss else 0)\""
      rationale: "八个产物必须都写出来且非空；summary.json 必须是合法 JSON（真正的语义判据在外部）"

limits: {max_rounds: 4}
notes: 产物规格见 input/instruction.md；判据是官方的，不在本任务内。
