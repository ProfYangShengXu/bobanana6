# 主验题（域 3：货运）：三个来源 → 一份货主月度运输面板。★ 会切出多块（3 读 + 1 写）。
#
# 与 panel-three-sources 同形状（同一批实体 + 多来源 + 合并成一张表）、不同领域：
# 实体换成货主号、字段换成重量与运费、单位异构换成吨/kg（§15.3 同形状 × 3 域）。
task_id: main-panel-freight-lanes
goal: 把三份来源里同一批货主的月度运输重量与运费整理成一份可复核的面板
version: 1

deliverables:
  - name: shipments.csv
    schema: {shipper: str, weight_kg: float, cost_cny: float}

sources:
  - {ref: lane-east, locator: input/lane-east.csv}
  - {ref: lane-south, locator: input/lane-south.csv}
  - {ref: lane-west, locator: input/lane-west.csv}

constraints:
  hard:
    - id: C-rows
      kind: presence
      target: shipments.csv
      spec: {min_rows: 1}
      rationale: "面板不允许为空——空表会被下游当成「这些货主没有运输」"
    - id: C-prov
      kind: provenance
      target: shipments.csv
      spec: {min_coverage: 0.95}
      rationale: "每个值都要能指回一份快照，否则无法复核"
    - id: C-fields
      kind: schema
      target: shipments.csv
      spec: {columns: [{name: shipper, dtype: str}, {name: weight_kg, dtype: str}, {name: cost_cny, dtype: str}]}
      rationale: "三份来源合并后列名与类型必须仍然一致"
    - id: C-units
      kind: unit_consistency
      target: shipments.csv
      spec: {concept: weight_kg, unit: kg}
      rationale: "重量必须可判单位：源里带单位就归一，没标就要说出来是假设，不许静默当 kg"

blind:
  - "来源若以吨记账且不标注，单看一列无法判定单位"

limits: {max_rounds: 3}

notes: 主验题域 3：多块 pipeline，跨源同实体 + 单位异构。
