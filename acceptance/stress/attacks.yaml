# 攻击注入点（`实现规格.md §14.2` 原文照抄）—— ★ 这是【清单】，不是执行器。
#
# 每行一个可独立开关的攻击：`assert` 是它要触到的架构断言，`inject` 是怎么注入，
# `expect` 是期望行为。执行器（按 id 开关、跑完收集三步判据）留给 inject/ 那一块。
attacks:
  - id: A01-mesh-dependency
    assert: 切分器能切出星形且可独立验证
    inject: 实体 ID 只在源 7 出现，源 12 需要它才能查
    expect: 不是硬切掉这条边，而是【识别为跨块依赖】或在 L1 补一条数据约束

  - id: A02-polysemy
    assert: 语义层能防住「各立一套」
    inject: 「营收」在 4 个源里 4 种口径（含税/不含税/合并/母公司）
    expect: 语义层在 L-1 阶段就归一，【不是】让各块各自定义
    fail_if: 出现 DefinitionMismatch（说明没在 L-1 拦住）

  - id: A03-real-conflict
    assert: 判定内核能区分「错」与「冲突」
    inject: 两个权威源对同一年给出不同值，【都不是错的】
    expect: 产出 Conflict + 双方证据都留
    fail_if: 判成 fail（错）或随便挑一个（更错）

  - id: A04-missing-not-zero
    assert: 「缺失 ≠ 0」不被静默填平
    inject: 源里故意留空缺格，且【不标注】
    expect: 面板里是「缺失」，不是 0
    fail_if: 任何位置出现被填平的 0

  - id: A05-transient
    assert: 局部重试能救回来
    inject: 两个源前 2 次超时，第 3 次成功
    expect: RETRY_LOCAL 且最终通过

  - id: A06-persistent
    assert: 救不回来时走对出口
    inject: 一个源整体下线
    expect: 【不是】无限重试 → 走降级或标记不可得
    fail_if: 重试次数超过上限

  - id: A07-same-symptom-different-layer
    assert: 归因能定位到层
    inject: 三个块都报「算不出来」，根因分别是 工具坏 / 上下文没给到 / 判定器太严
    expect: 三条 blame 各不相同
    fail_if: 三条给同一个 blame

  - id: A08-global-invariant
    assert: 装配检查能发现拼不上
    inject: 每个块单独看都合格，但合并后某一列跨实体口径不一致
    expect: assemble 拒绝
    fail_if: 装配通过

  - id: A09-impossible
    assert: 拒答是合法出口
    inject: 某实体的关键字段只存在于那个已下线的源里
    expect: status=declined，【明确报告拿不到】
    fail_if: 编一个值出来（最严重）／一直重试

  - id: A10-units
    assert: 单位不标也能对齐
    inject: 元/千元/百万元混用，且部分源不标
    expect: 归一后数值正确
